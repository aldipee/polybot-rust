[package]
name = "polybot_convert_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
alloy-signer-local = "0.5"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
csv = "1.4"
dotenvy = "0.15"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rs-clob-client = "0.1.5"
postgres = "0.19"
rust_decimal = { version = "1.39", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"] }
tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
uuid = { version = "1.11", features = ["v4"] }

[patch.crates-io]
rs-clob-client = { path = "vendor/rs-clob-client" }
