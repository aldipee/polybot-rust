services:
  postgres:
    container_name: polybot-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polybot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polybot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    
  polybot-btc-data-collection-5m:
    container_name: polybot-btc-5m-data-collection
    user: "0:0"
    working_dir: /app/state
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    network_mode: host
    env_file:
      - data_collection.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://postgres:postgres@localhost:5432/polybot
      LOG_DIR: /app/output
      EXEC_LATENCY_LOG_DIR: /app/logs
      SIGNAL_FILE_DIR: /app/signals
      EXEC_LATENCY_FILE_LOG_ENABLED: "false"
      EXEC_LATENCY_JSONL_ENABLED: "false"
      EXEC_LATENCY_CSV_ENABLED: "false"
      MARKET_SLUG: btc-updown-5m-1771655400
    volumes:
      - ./data:/app/data
      - ./signals:/app/signals
      - ./state:/app/state
    tmpfs:
      - /app/output:size=64m,mode=1777
      - /app/logs:size=64m,mode=1777
    restart: unless-stopped

