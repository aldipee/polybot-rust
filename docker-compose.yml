services:
  polybot-btc-after-market_2:
    container_name: polybot-btc-after-market_2
    working_dir: /app/state
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    network_mode: host
    cpuset: "2"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    env_file:
      - after_market.env
    environment:
      LOG_DIR: /app/output
      EXEC_LATENCY_LOG_DIR: /app/logs
      SIGNAL_FILE_DIR: /app/signals
      EXEC_LATENCY_FILE_LOG_ENABLED: "false"
      EXEC_LATENCY_JSONL_ENABLED: "false"
      EXEC_LATENCY_CSV_ENABLED: "false"
      MARKET_SLUG: btc-updown-5m-1771675500
        
    volumes:
      - ./data:/app/data
      - ./signals:/app/signals
      - ./state:/app/state
    tmpfs:
      - /app/output:size=64m,mode=1777
      - /app/logs:size=64m,mode=1777
    restart: unless-stopped

